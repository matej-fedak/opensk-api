services:
  - type: web
    name: opensk-api
    runtime: python
    plan: free
    buildCommand: python -m pip install --require-hashes -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /v1/health
    autoDeployTrigger: checksPass
