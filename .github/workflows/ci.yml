name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate datasets
        run: python scripts/validate_datasets.py

      - name: Check referential integrity
        run: python scripts/check_referential_integrity.py

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m compileall scripts routers services tests schemas

      - name: Check whitespace errors
        run: git diff --check
